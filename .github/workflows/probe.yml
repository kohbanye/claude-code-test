name: sec-probe
on: push
permissions:
  contents: write
  pull-requests: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: try direct push to main
        run: |
          git config user.name ci; git config user.email ci@example.com
          echo "actions probe $(date -u)" >> README.md
          git add README.md && git commit -m "actions probe" || true
          if git push origin HEAD:refs/heads/main; then echo "RESULT: PUSH_TO_MAIN_SUCCEEDED"; else echo "RESULT: PUSH_TO_MAIN_BLOCKED"; fi
      - name: try API contents write to main
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -d '{"message":"probe","content":"eA==","branch":"main","path":"actions-probe.txt"}' \
            https://api.github.com/repos/${{ github.repository }}/contents/actions-probe.txt)
          echo "RESULT: API_CONTENTS_WRITE_HTTP=$code"
